name: release

on:
  push:
    tags: ["rpress-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: install cross toolchain (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../rpress-${{ matrix.target }}.tar.gz rpress
          cd ../../..
          sha256sum rpress-${{ matrix.target }}.tar.gz > rpress-${{ matrix.target }}.tar.gz.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rpress-${{ matrix.target }}.tar.gz
            rpress-${{ matrix.target }}.tar.gz.sha256
