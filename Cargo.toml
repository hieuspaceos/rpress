[package]
name = "rpress"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
minijinja = "2"
axum = { version = "0.8", features = ["multipart", "form"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
argon2 = "0.5"
rand = "0.8"
parking_lot = "0.12"
serde_urlencoded = "0.7"
sha2 = "0.10"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
similar = "2"
flate2 = "1"
toml = "0.8"

[workspace]

[lib]
name = "rpress"
path = "src/lib.rs"

[profile.release]
# Release profile (audit L): thin LTO + single codegen unit for the
# hot render loop; strip drops the symbol table out of the deployed bin.
lto = "thin"
codegen-units = 1
strip = true
